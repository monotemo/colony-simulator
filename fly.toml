# Fly.io config for the full colony-simulator: the colony-server backend
# (API + WebSocket) *and* the Angular frontend it serves as static files.
#
# The app name is global and must match the app created on Fly
# (`fly apps create colony-simulator-api`). The Dockerfile builds the Angular
# bundle into the image and sets COLONY_STATIC_DIR, so the server serves the
# frontend at the origin root alongside /ws + /api — one app, one origin.

app = "colony-simulator-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  # The server binds 0.0.0.0:8080 (see colony-server/src/main.rs).
  internal_port = 8080
  force_https = true
  # Scale to zero when idle to keep the demo cheap. The frontend runs in-browser
  # (wasm), so a visit is a burst of static-file requests rather than a held
  # WebSocket — the machine cold-starts to serve the bundle, then stops again.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Liveness probe against the existing health endpoint.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
