# Fly.io config for the colony-server backend (API + WebSocket).
#
# The app name is global and must match the app created on Fly
# (`fly apps create colony-simulator-api`). The frontend is hosted on GitHub
# Pages, so this deploys the Rust server alone.

app = "colony-simulator-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  # The server binds 0.0.0.0:8080 (see colony-server/src/main.rs).
  internal_port = 8080
  force_https = true
  # Scale to zero when idle to keep a demo backend cheap; a live WebSocket
  # connection counts as traffic, so an active client keeps the machine up.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Liveness probe against the existing health endpoint.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
